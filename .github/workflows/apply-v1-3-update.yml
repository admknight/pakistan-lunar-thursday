name: Apply v1.3.0 Android source update (one time)

on:
  push:
    paths:
      - '.bootstrap/update.tar.gz'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify and apply reviewed update
        shell: bash
        run: |
          set -euo pipefail
          echo "4adf03f48af1385cd9db4bd6e2b80d84dc1702e98f0908ef8f380db79d9854f7  .bootstrap/update.tar.gz" | sha256sum --check
          test "$(tar -tzf .bootstrap/update.tar.gz | wc -l)" -eq 15
          tar -xzf .bootstrap/update.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/apply-v1-3-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add optional ringing alarm, settings and GitHub update manager v1.3.0"
          git push origin HEAD:main

      - name: Trigger APK build and preview publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-apk.yml --ref main
