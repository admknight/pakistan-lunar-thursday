name: Apply verified v1.4.0 UI and signing update (one time)
on:
  push:
    paths: ['.github/workflows/apply-v1-4-update.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and publish reviewed Android sources
        shell: bash
        run: |
          set -euo pipefail
          echo 'e7a046637bd7147dcca1776ef4f1f06735b4673a4e39259d144b74e2c4669534  .bootstrap/v14-source.tar.gz' | sha256sum --check
          test "$(tar -tzf .bootstrap/v14-source.tar.gz | wc -l)" -eq 10
          if tar -tzf .bootstrap/v14-source.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Archive contains unsafe paths'; exit 1
          fi
          tar -xzf .bootstrap/v14-source.tar.gz
          # GitHub Actions job token lacks workflows permission; publish this file separately.
          rm -f .github/workflows/publish-stable.yml
          rm -rf .bootstrap
          rm -f .github/workflows/apply-v1-4-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add v1.4 interactive dashboard, About page and locked stable signing'
          git push origin HEAD:main
      - name: Trigger GitHub APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main
