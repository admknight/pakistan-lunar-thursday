name: Apply Hilal Thursday v1.5 bilingual update (one time)
on:
  push:
    paths: ['.bootstrap/v15-source.tar.gz']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and publish reviewed Android sources
        shell: bash
        run: |
          set -euo pipefail
          echo '05e53a3d182a6c9ac102c4dadc7c5f7efaa0d1f6d05bdca07e6e2cf700e95ddc  .bootstrap/v15-source.tar.gz' | sha256sum --check
          test "$(tar -tzf .bootstrap/v15-source.tar.gz | wc -l)" -eq 20
          if tar -tzf .bootstrap/v15-source.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$)|(^|/)\.github/)'; then
            echo 'Archive contains unexpected paths'; exit 1
          fi
          tar -xzf .bootstrap/v15-source.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/apply-v1-5-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Localize Hilal Thursday in English and Urdu, redesign adaptive app icon v1.5'
          git push origin HEAD:main
      - name: Trigger APK build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run build-apk.yml --ref main
