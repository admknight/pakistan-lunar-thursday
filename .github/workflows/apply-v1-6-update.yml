name: Apply Hilal Thursday v1.6 dashboard update (one time)
on:
  push:
    paths: ['.bootstrap/v16-ui.tar.xz']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and publish reviewed Android UI source
        shell: bash
        run: |
          set -euo pipefail
          echo 'a44862c5f9ade61bfec76e9d1157b0966a78933c19c01d3032816d42736ece24  .bootstrap/v16-ui.tar.xz' | sha256sum --check
          test "$(tar -tJf .bootstrap/v16-ui.tar.xz | wc -l)" -eq 14
          if tar -tJf .bootstrap/v16-ui.tar.xz | grep -Eq '(^/|(^|/)\.\.(/|$)|(^|/)\.github/)'; then
            echo 'Unexpected archive path'; exit 1
          fi
          if tar -tJf .bootstrap/v16-ui.tar.xz | grep -Ev '^app/(src/main/(java/com/scopewise/lunarthursday/|res/(values|values-ur|drawable)/)|build.gradle$)' ; then
            echo 'Archive has unexpected source location'; exit 1
          fi
          tar -xJf .bootstrap/v16-ui.tar.xz --no-same-owner
          rm -rf .bootstrap
          rm -f .github/workflows/apply-v1-6-update.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Redesign Hilal Thursday dashboard and About page v1.6.0'
          git push origin HEAD:main
      - name: Trigger debug APK build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main
