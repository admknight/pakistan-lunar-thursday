name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run unit tests (date engine, feed, version and reminder rules)
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Check the announcement-reading rules
        run: python3 -m unittest discover -s scripts/tests

      - name: Verify the three reviewed Gemini music excerpts
        shell: bash
        run: |
          set -euo pipefail
          echo 'fd1657085514b96eb094f63787d22ae5c2a38f7f769ad95beecccf6a1086201d  app/src/main/res/raw/hilal_noor.ogg' | sha256sum --check
          echo '75d44a1a8d6c02b31fa30c7639920eaf8d1ca94ed37ad588bc58ea5190962990  app/src/main/res/raw/sukoon.ogg' | sha256sum --check
          echo '28d38bbd1dfa4ad9b3b631864b985dfcb1c28883d80900753064a39a311a1e80  app/src/main/res/raw/hilal_nida.ogg' | sha256sum --check

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Record APK SHA-256
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Publish installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarThursday-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 30
          if-no-files-found: error

  publish-preview-release:
    name: Publish installable preview on GitHub Releases
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out versioned source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download APK from successful build
        uses: actions/download-artifact@v4
        with:
          name: LunarThursday-debug-apk
          path: release

      - name: Verify APK and determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check app-debug.apk.sha256
          test -s app-debug.apk
          cd ..
          VERSION="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*$/\1/p" app/build.gradle | head -n 1)"
          test -n "$VERSION" || { echo "Cannot determine versionName"; exit 1; }
          echo "tag=v$VERSION-preview" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub pre-release (version once only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving published assets unchanged."
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## Pakistan Lunar Thursday — Android preview
          This debug-signed APK reminds you on the first Thursday of each Islamic month at a **user-selected Pakistan time** (default 11:00 AM PKT). Version 2.0.0 keeps the first-Thursday reminder and adds: confirmed month starts read from news reports of the Central Ruet-e-Hilal Committee's announcement (by the app itself around the 29th, and from this project's corrections file); a quiet "Possible first Thursday" notice in the rare month where the first Thursday depends on the sighting; an observances calendar with three sets and quiet day-of reminders; today's prayer times for a chosen city with a Karachi (Hanafi Asr) or Jafari method, plus a Ramadan line; a daily verse card that can be shared as an image; a Qibla bearing; a tasbih counter; and a home-screen widget. It also fixes a case where a late date correction could suppress the correct reminder.

          **Install:** Download the APK asset below, allow installation from your browser/file manager, open the app, and grant notification and (when available) exact-alarm permissions. Android 8.0 or newer is required.

          **Preview limitations:** The APK is debug-signed with a per-run key, so it cannot update an installed signed release; uninstall the other build first, and expect to reconfigure settings. None of the 2.0.0 additions has been verified on a physical phone yet: alarm and notification timing, the widget, the verse card's rendering and sharing are untested on a device. Month starts come from forecasts, news reports and a project-maintained file, not an official government source, and can be late or wrong. Observance dates are a project-maintained list. Prayer times and the Qibla bearing are calculated, not a mosque timetable. The Quran text is from the Tanzil Project (unchanged); the Urdu translations are for non-commercial use only. This is **not** a production-signed or Play Store release.

          Verify the APK against the accompanying .sha256 file before sharing, if possible.
          NOTES
          gh release create "$TAG" \
            release/app-debug.apk \
            release/app-debug.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "Hilal Thursday v$APP_VERSION (Preview, debug-signed)" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md"
