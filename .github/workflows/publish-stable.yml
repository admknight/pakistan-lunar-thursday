name: Publish permanently signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build and publish a verified, permanently signed APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out released source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify signing secrets and reconstruct private keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$KEYSTORE_B64" || -z "$ANDROID_RELEASE_STORE_PASSWORD" ]]; then
            echo 'The two release signing secrets are not configured. See docs/SIGNING.md.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lunar-thursday-release.p12"
          keytool -exportcert \
            -keystore "$RUNNER_TEMP/lunar-thursday-release.p12" \
            -storetype PKCS12 -alias lunarthursday \
            -storepass:env ANDROID_RELEASE_STORE_PASSWORD \
            -file "$RUNNER_TEMP/lunar-thursday-cert.der" > /dev/null
          observed="$(sha256sum "$RUNNER_TEMP/lunar-thursday-cert.der" | cut -d ' ' -f 1)"
          expected='d28b982a625b0864347343e566f1f96400ad5f399b43c233954bc9911cb996f1'
          if [[ "$observed" != "$expected" ]]; then
            echo 'Signing certificate does not match the locked release identity; refusing to publish.' >&2
            exit 1
          fi
          echo 'Release certificate fingerprint verified.'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Run unit tests (date engine, feed, version and reminder rules)
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Verify the three reviewed Gemini music excerpts
        shell: bash
        run: |
          set -euo pipefail
          echo 'fd1657085514b96eb094f63787d22ae5c2a38f7f769ad95beecccf6a1086201d  app/src/main/res/raw/hilal_noor.ogg' | sha256sum --check
          echo '75d44a1a8d6c02b31fa30c7639920eaf8d1ca94ed37ad588bc58ea5190962990  app/src/main/res/raw/sukoon.ogg' | sha256sum --check
          echo '28d38bbd1dfa4ad9b3b631864b985dfcb1c28883d80900753064a39a311a1e80  app/src/main/res/raw/hilal_nida.ogg' | sha256sum --check

      - name: Build signed release APK
        env:
          ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/lunar-thursday-release.p12
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signing certificate and checksum
        id: version
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
          grep -F 'Signer #1 certificate SHA-256 digest: d28b982a625b0864347343e566f1f96400ad5f399b43c233954bc9911cb996f1' "$RUNNER_TEMP/signature.txt"
          version="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*$/\1/p" app/build.gradle | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid versionName'; exit 1; }
          tag="v$version"
          mkdir -p release
          cp "$apk" "release/HilalThursday-$tag.apk"
          (cd release && sha256sum "HilalThursday-$tag.apk" > "HilalThursday-$tag.apk.sha256")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish public GitHub Release (never overwrite)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Bump versionCode/versionName rather than replacing published assets." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/signed-release-notes.md" <<'NOTES'
          ## Permanently signed Android APK
          This APK is built with the project's locked, long-lived signing certificate, allowing **future APK updates signed with the same key** to install in place.

          **If you installed an earlier debug-signed preview, uninstall it before installing this release.** Android cannot update between different signer certificates. Reconfigure your settings after uninstalling.

          Version 2.0.0 keeps the first-Thursday reminder and adds: confirmed month starts read from news reports of the Central Ruet-e-Hilal Committee's announcement (by the app itself around the 29th, and from this project's corrections file); a quiet "Possible first Thursday" notice in the rare month where the first Thursday depends on the sighting; an observances calendar with three sets and quiet day-of reminders; today's prayer times for a chosen city with a Karachi (Hanafi Asr) or Jafari method, plus a Ramadan line; a daily verse card that can be shared as an image; a Qibla bearing; a tasbih counter; and a home-screen widget. It also fixes a case where a late date correction could suppress the correct reminder.

          **Limits:** None of the 2.0.0 additions has been verified on a physical phone yet: alarm and notification timing, the widget, the verse card's rendering and sharing are untested on a device. Month starts come from forecasts, news reports and a project-maintained file, not an official government source, and can be late or wrong. Observance dates are a project-maintained list. Prayer times and the Qibla bearing are calculated, not a mosque timetable. The Quran text is from the Tanzil Project (unchanged); the Urdu translations are for non-commercial use only. Installation updates require Android confirmation. Download the `.sha256` file to verify the APK before sharing it.
          NOTES
          gh release create "$TAG" \
            "release/HilalThursday-$TAG.apk" \
            "release/HilalThursday-$TAG.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "Hilal Thursday $TAG" \
            --notes-file "$RUNNER_TEMP/signed-release-notes.md"

      - name: Remove ephemeral release key material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/lunar-thursday-release.p12" \
                "$RUNNER_TEMP/lunar-thursday-cert.der" \
                "$RUNNER_TEMP/signature.txt"
