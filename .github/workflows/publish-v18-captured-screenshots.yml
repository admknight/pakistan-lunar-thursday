name: Publish verified v1.8 emulator screenshots from captured artifact

on:
  push:
    paths: ['.github/workflows/publish-v18-captured-screenshots.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Restore exact validated screenshot artifact from capture run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hilal-capture"
          gh run download 43301311373 --repo "$GITHUB_REPOSITORY" \
            --name real-hilal-thursday-v1.8-emulator-screenshots \
            --dir "$RUNNER_TEMP/hilal-capture"
          # gh refuses to extract over existing checkout PNGs. Preserve exact
          # artifact bytes and intentionally replace only documented captures.
          cp "$RUNNER_TEMP/hilal-capture"/*.png docs/screenshots/

      - name: Verify screenshots are genuine PNG captures of expected dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,struct,pathlib
          directory=pathlib.Path('docs/screenshots')
          expected=['home-en','home-ur','calendar-en','updates-en','about-en',
                    'settings-en','settings-alarm-en','alarm-sounds-en','weather-settings-en']
          for name in expected:
              path=directory/(name+'.png')
              data=path.read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n' and data[12:16]==b'IHDR', str(path)
              width,height=struct.unpack('>II',data[16:24])
              assert (width,height)==(1080,2340), (str(path),width,height)
              assert len(data)>50_000, str(path)
              print(name, len(data), 'bytes',width,'x',height)
          assert len(expected)==9
          PY

      - name: Publish capture without staging APKs, workflow files or counter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/*.png
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Screenshots already match the verified artifact'
            exit 0
          fi
          git commit -m 'Publish nine genuine signed v1.8 Android emulator screenshots [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Could not publish verified screenshots' >&2
          exit 1
