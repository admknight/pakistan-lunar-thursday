name: Trigger Hilal Thursday v1.5 signed release (one time)

on:
  push:
    paths: ['.github/workflows/trigger-stable-v15.yml']

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify release status and remove this one-time launcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.5.0 > /dev/null 2>&1; then
            echo 'v1.5.0 signed release already exists; no dispatch necessary.'
            exit 0
          fi
          if ! gh release view v1.5.0-preview > /dev/null 2>&1; then
            echo 'v1.5.0 preview must first pass APK compilation.'
            exit 1
          fi
          rm -f .github/workflows/trigger-stable-v15.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove one-time signed-release trigger [skip ci]'
          git push origin HEAD:main

      - name: Dispatch certificate-verified release build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-stable.yml --ref main
