name: Trigger Hilal Thursday v1.8.1 signed contrast fix (one time)
on:
  push:
    paths: ['.github/workflows/trigger-v181-release.yml']

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify compiled preview and remove the one-time launcher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.8.1 > /dev/null 2>&1; then
            echo 'Stable v1.8.1 already exists. Never replace.'
            exit 0
          fi
          gh release view v1.8.1-preview > /dev/null
          rm -f .github/workflows/trigger-v181-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove one-time v1.8.1 release launcher [skip ci]'
          git push origin HEAD:main

      - name: Dispatch signed APK build and certificate verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-stable.yml --ref main
