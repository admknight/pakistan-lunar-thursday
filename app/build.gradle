plugins {
    id 'com.android.application'
}

// Release signing is configured only when the CI job supplies the two secure secrets.
// No keystore, password or private key is stored in source control.
def releaseStore = System.getenv('ANDROID_RELEASE_STORE_FILE')
def releasePassword = System.getenv('ANDROID_RELEASE_STORE_PASSWORD')

android {
    namespace 'com.scopewise.lunarthursday'
    compileSdk 36

    defaultConfig {
        applicationId 'com.scopewise.lunarthursday'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.7.0'
    }

    if (releaseStore && releasePassword) {
        signingConfigs {
            release {
                storeFile file(releaseStore)
                storePassword releasePassword
                keyAlias 'lunarthursday'
                keyPassword releasePassword
                storeType 'pkcs12'
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
}
