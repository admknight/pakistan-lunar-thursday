plugins {
    id 'com.android.application'
}

android {
    namespace 'com.scopewise.lunarthursday'
    compileSdk 37

    defaultConfig {
        applicationId 'com.scopewise.lunarthursday'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
}
